<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noriの書架</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FAFAF7;
  --ink: #1A1A1A;
  --ai: #1F3A5F;
  --gray: #8A8A85;
  --hairline: #E4E2DC;
  --card: #fff;
  --excerpt: #3d3d3a;
}
.dark {
  --paper: #141414;
  --ink: #E8E6E0;
  --ai: #7BAFD4;
  --gray: #5E5E59;
  --hairline: #2A2A2A;
  --card: #1E1E1E;
  --excerpt: #A0A09A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  line-height: 2;
  transition: background .3s, color .3s;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ヘッダー */
header {
  max-width: 1080px;
  margin: 0 auto;
  padding: 40px 28px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}
.site-title { cursor: pointer; }
.site-title h1 {
  font-family: 'Shippori Mincho', serif;
  font-weight: 700;
  font-size: 1.65rem;
  letter-spacing: 0.12em;
}
.site-title small {
  display: block;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.67rem;
  color: var(--gray);
  letter-spacing: 0.22em;
  margin-top: 4px;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.header-nav { display: flex; gap: 20px; }
.header-nav a {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  color: var(--gray);
  transition: color .2s;
}
.header-nav a:hover { color: var(--ai); }
.theme-btn {
  background: var(--hairline);
  border: none;
  border-radius: 20px;
  padding: 6px 14px;
  cursor: pointer;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  color: var(--gray);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background .3s;
  white-space: nowrap;
}

/* カテゴリーナビ（横並び） */
.cat-nav {
  max-width: 1080px;
  margin: 36px auto 0;
  padding: 0 28px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.cat-btn {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.76rem;
  letter-spacing: 0.14em;
  padding: 7px 18px;
  border: 1px solid var(--hairline);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  transition: all .2s ease;
  white-space: nowrap;
}
.cat-btn:hover { border-color: var(--ai); color: var(--ai); }
.cat-btn.active {
  background: var(--ai);
  border-color: var(--ai);
  color: var(--paper);
}
.cat-count { font-size: 0.62rem; margin-left: 6px; opacity: 0.7; }

/* メイン */
.main-content {
  max-width: 1080px;
  margin: 36px auto 0;
  padding: 0 28px 96px;
}

/* ローディング */
.loading {
  text-align: center;
  padding: 80px 0;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  color: var(--gray);
}

/* 一覧 */
.list-head {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  color: var(--gray);
  border-bottom: 1px solid var(--ink);
  padding-bottom: 11px;
  display: flex;
  justify-content: space-between;
}
.entry {
  padding: 30px 0;
  border-bottom: 1px solid var(--hairline);
  cursor: pointer;
  max-width: 760px;
}
.entry-meta {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 9px;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  color: var(--gray);
}
.cat-label {
  color: var(--ai);
  border: 1px solid var(--ai);
  padding: 1px 9px;
}
.entry h2 {
  font-family: 'Shippori Mincho', serif;
  font-weight: 600;
  font-size: 1.28rem;
  line-height: 1.7;
  letter-spacing: 0.03em;
  transition: color .2s;
}
.entry:hover h2 { color: var(--ai); }
.entry .biblio { font-size: 0.83rem; color: var(--gray); margin-top: 4px; }
.entry .excerpt {
  font-size: 0.9rem;
  line-height: 1.95;
  margin-top: 10px;
  color: var(--excerpt);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 記事ページ */
#article-view { display: none; }
.back-btn {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.76rem;
  letter-spacing: 0.15em;
  color: var(--gray);
  background: none;
  border: none;
  cursor: pointer;
  margin-bottom: 36px;
  padding: 0;
  transition: color .2s;
}
.back-btn:hover { color: var(--ai); }
article { max-width: 720px; }
article h1 {
  font-family: 'Shippori Mincho', serif;
  font-weight: 700;
  font-size: 1.75rem;
  line-height: 1.65;
  letter-spacing: 0.03em;
}
.biblio-box {
  margin-top: 20px;
  padding: 15px 19px;
  background: var(--card);
  border: 1px solid var(--hairline);
  font-size: 0.84rem;
  line-height: 1.9;
  transition: background .3s;
}
.biblio-box dt {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.67rem;
  letter-spacing: 0.2em;
  color: var(--gray);
  margin-top: 10px;
}
.biblio-box dt:first-child { margin-top: 0; }
.article-body { margin-top: 48px; }
.article-body p {
  margin-bottom: 1.8em;
  text-align: justify;
  line-height: 2;
  font-size: 0.97rem;
}
.article-body h2 {
  font-family: 'Shippori Mincho', serif;
  font-size: 1.18rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  margin: 52px 0 22px;
  padding-left: 13px;
  border-left: 3px solid var(--ai);
  line-height: 1.7;
}
.article-foot {
  margin-top: 64px;
  padding-top: 20px;
  border-top: 1px solid var(--ink);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.76rem;
  color: var(--gray);
  letter-spacing: 0.1em;
  display: flex;
  justify-content: space-between;
}

/* フッター */
footer {
  border-top: 1px solid var(--hairline);
  padding: 32px 24px 52px;
  text-align: center;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  color: var(--gray);
}

/* PC：背表紙縦並び */
@media (min-width: 1024px) {
  .cat-nav { display: none; }
  .main-content {
    display: grid;
    grid-template-columns: 116px 1fr;
    gap: 48px;
    align-items: start;
  }
  .spine-wrap {
    position: sticky;
    top: 48px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }
  .spine-btn {
    writing-mode: vertical-rl;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.76rem;
    letter-spacing: 0.28em;
    padding: 18px 9px;
    border: 1px solid var(--hairline);
    background: var(--card);
    color: var(--ink);
    min-height: 130px;
    cursor: pointer;
    transition: all .25s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .spine-btn:hover { border-color: var(--ai); color: var(--ai); }
  .spine-btn.active {
    background: var(--ai);
    border-color: var(--ai);
    color: var(--paper);
  }
  .spine-count {
    writing-mode: horizontal-tb;
    font-size: 0.62rem;
    letter-spacing: 0;
    margin-top: 10px;
    color: var(--gray);
  }
  .spine-btn.active .spine-count { color: rgba(250,250,247,.6); }
  .list-content { min-width: 0; }
}
@media (max-width: 1023px) {
  .spine-wrap { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="site-title" onclick="showList()">
    <h1>Noriの書架</h1>
    <small>NORI'S BOOKSHELF — READING NOTES</small>
  </div>
  <div class="header-right">
    <nav class="header-nav">
      <a href="#">読書一覧</a>
      <a href="#">蔵書リスト</a>
      <a href="#">このサイトについて</a>
    </nav>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙 ダーク</button>
  </div>
</header>

<div class="cat-nav" id="cat-nav-mobile"></div>

<div class="main-content">
  <div class="spine-wrap" id="spine-nav"></div>

  <div class="list-content">
    <div id="article-view">
      <button class="back-btn" onclick="showList()">← 一覧へ戻る</button>
      <article>
        <div class="entry-meta" id="art-meta"></div>
        <h1 id="art-title"></h1>
        <dl class="biblio-box" id="art-biblio"></dl>
        <div class="article-body" id="art-body"></div>
        <div class="article-foot" id="art-foot"></div>
      </article>
    </div>

    <div id="list-view">
      <div class="loading" id="loading">読み込み中…</div>
      <div id="list-body" style="display:none;">
        <div class="list-head">
          <span id="list-label">最新の読書から</span>
          <span id="list-count"></span>
        </div>
        <div id="entries"></div>
      </div>
    </div>
  </div>
</div>

<footer>Noriの書架 — 2026</footer>

<script>
// ============================================
// 設定：GASのウェブアプリURL
// ============================================
const API_URL = "https://script.google.com/macros/s/AKfycbwx5moU2QidgpknPryJ3913NLzVXQUivFeAOChIF9lYYmBPUAIfYhuX8ZrJqUiryQJr/exec";

let ENTRIES = [];
let CATS = [{ label: "すべて" }];
let activeCat = "すべて";
let isDark = false;

function getCount(label) {
  return label === "すべて"
    ? ENTRIES.length
    : ENTRIES.filter(e => e.cat === label).length;
}

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle("dark", isDark);
  document.getElementById("theme-btn").textContent = isDark ? "☀️ ライト" : "🌙 ダーク";
}

function buildNav() {
  const spine = document.getElementById("spine-nav");
  spine.innerHTML = "";
  CATS.forEach(({ label }) => {
    const btn = document.createElement("button");
    btn.className = "spine-btn" + (label === activeCat ? " active" : "");
    btn.innerHTML = `${label}<span class="spine-count">${getCount(label)}</span>`;
    btn.onclick = () => selectCat(label);
    spine.appendChild(btn);
  });

  const mobile = document.getElementById("cat-nav-mobile");
  mobile.innerHTML = "";
  CATS.forEach(({ label }) => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (label === activeCat ? " active" : "");
    btn.innerHTML = `${label}<span class="cat-count">${getCount(label)}</span>`;
    btn.onclick = () => selectCat(label);
    mobile.appendChild(btn);
  });
}

function selectCat(label) {
  activeCat = label;
  buildNav();
  renderList();
  showList();
}

function renderList() {
  const filtered = activeCat === "すべて"
    ? ENTRIES
    : ENTRIES.filter(e => e.cat === activeCat);
  document.getElementById("list-label").textContent =
    activeCat === "すべて" ? "最新の読書から" : activeCat;
  document.getElementById("list-count").textContent = `全 ${filtered.length} 冊`;
  const container = document.getElementById("entries");
  container.innerHTML = "";
  filtered.forEach(entry => {
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `
      <div class="entry-meta">
        <span class="cat-label">${entry.cat}</span>
        <span>${entry.date}</span>
      </div>
      <h2>${entry.title}</h2>
      <div class="biblio">${entry.biblio}</div>
      <p class="excerpt">${entry.excerpt}</p>
    `;
    div.onclick = () => showArticle(entry);
    container.appendChild(div);
  });
}

function showArticle(entry) {
  document.getElementById("art-meta").innerHTML =
    `<span class="cat-label">${entry.cat}</span><span>${entry.date}</span>`;
  document.getElementById("art-title").textContent = entry.title;
  document.getElementById("art-biblio").innerHTML =
    `<dt>書誌情報</dt><dd>${entry.biblio}</dd><dt>分類</dt><dd>${entry.sub}</dd>`;
  document.getElementById("art-body").innerHTML = entry.body;
  document.getElementById("art-foot").innerHTML =
    `<span>${entry.sub}</span><span>${entry.date} 記</span>`;
  document.getElementById("article-view").style.display = "block";
  document.getElementById("list-view").style.display = "none";
  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById("article-view").style.display = "none";
  document.getElementById("list-view").style.display = "block";
  window.scrollTo(0, 0);
}

// GASからデータを取得
async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    ENTRIES = data.entries || [];
    CATS = [{ label: "すべて" }, ...(data.cats || []).map(c => ({ label: c }))];
    document.getElementById("loading").style.display = "none";
    document.getElementById("list-body").style.display = "block";
    buildNav();
    renderList();
  } catch (err) {
    document.getElementById("loading").textContent =
      "記事の読み込みに失敗しました。時間をおいて再読み込みしてください。";
    console.error(err);
  }
}

loadData();
</script>
</body>
</html>
